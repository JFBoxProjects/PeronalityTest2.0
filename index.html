<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Personality Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d1a; --surface: #161628; --card: #1e1e38;
      --border: rgba(255,255,255,0.07); --text: #e8eaf0; --sub: #7880a0;
      --y: #f59e0b; --yd: rgba(245,158,11,0.13);
      --b: #60a5fa; --bd: rgba(96,165,250,0.13);
      --r: #f87171; --rd: rgba(248,113,113,0.13);
      --g: #34d399; --gd: rgba(52,211,153,0.13);
    }
    body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    h1,h2,h3,h4 { font-family:'Syne',sans-serif; }
    #root { min-height:100vh; }

    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
    @keyframes scaleIn { from{opacity:0;transform:scale(0.96)} to{opacity:1;transform:scale(1)} }
    @keyframes slideFromRight { from{opacity:0;transform:translateX(28px)} to{opacity:1;transform:translateX(0)} }
    @keyframes slideFromLeft { from{opacity:0;transform:translateX(-28px)} to{opacity:1;transform:translateX(0)} }
    @keyframes orb1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(35px,-22px) scale(1.08)} }
    @keyframes orb2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-22px,32px) scale(0.92)} }
    @keyframes orb3 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(18px,18px) scale(1.04)} 66%{transform:translate(-14px,-10px) scale(0.96)} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    @keyframes popIn { 0%{transform:scale(0.7);opacity:0} 70%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
    @keyframes toast { 0%{opacity:0;transform:translateY(-10px)} 15%,85%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-10px)} }

    /* ── Welcome ─────────────────────────────── */
    .page-welcome { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; overflow:hidden; padding:2rem; }
    .orb { position:absolute; border-radius:50%; filter:blur(90px); opacity:0.28; pointer-events:none; }
    .orb-y { width:420px; height:420px; background:var(--y); top:-8%; left:-10%; animation:orb1 9s ease-in-out infinite; }
    .orb-b { width:360px; height:360px; background:var(--b); bottom:-8%; right:-6%; animation:orb2 11s ease-in-out infinite; }
    .orb-r { width:300px; height:300px; background:var(--r); top:42%; right:22%; animation:orb3 13s ease-in-out infinite; }
    .orb-g { width:260px; height:260px; background:var(--g); bottom:22%; left:12%; animation:orb1 10s ease-in-out infinite reverse; }
    .welcome-wrap { position:relative; z-index:1; text-align:center; width:100%; max-width:720px; animation:fadeUp 0.9s ease both; }
    .chip { display:inline-flex; align-items:center; gap:7px; padding:5px 14px; background:var(--card); border:1px solid var(--border); border-radius:100px; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--sub); margin-bottom:1.6rem; }
    .chip-dot { width:6px; height:6px; border-radius:50%; animation:pulse 2.2s ease-in-out infinite; }
    .welcome-title { font-size:clamp(2.4rem,8vw,5.5rem); font-weight:800; line-height:1.02; margin-bottom:1rem; letter-spacing:-0.025em; text-align:center; width:100%; }
    @media(max-width:480px){ .welcome-title { font-size:clamp(2rem,11vw,3.2rem); letter-spacing:-0.01em; } }
    .grad-text { background:linear-gradient(135deg,var(--y) 0%,var(--r) 38%,var(--b) 68%,var(--g) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .welcome-sub { color:var(--sub); font-size:1.05rem; font-weight:300; margin-bottom:2.5rem; line-height:1.65; }
    .four-dots { display:flex; gap:9px; justify-content:center; margin-bottom:2.2rem; }
    .four-dots span { width:11px; height:11px; border-radius:50%; }
    .btn-white { display:inline-flex; align-items:center; gap:10px; padding:14px 36px; background:white; color:#0d0d1a; border:none; border-radius:100px; font-family:'Syne',sans-serif; font-size:1rem; font-weight:700; cursor:pointer; transition:transform .2s,box-shadow .2s; letter-spacing:0.02em; }
    .btn-white:hover { transform:translateY(-3px); box-shadow:0 14px 44px rgba(255,255,255,0.14); }
    .btn-white svg { transition:transform .2s; }
    .btn-white:hover svg { transform:translateX(4px); }

    /* ── Name ─────────────────────────────────── */
    .page-name { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .name-card { background:var(--surface); border:1px solid var(--border); border-radius:24px; padding:2.8rem; max-width:460px; width:100%; animation:scaleIn .4s ease both; }
    .name-card h2 { font-size:2rem; font-weight:800; margin-bottom:.4rem; }
    .name-card p { color:var(--sub); font-size:.92rem; margin-bottom:1.8rem; line-height:1.55; }
    .color-bar-row { display:flex; gap:5px; margin-bottom:1.8rem; }
    .color-bar-row div { flex:1; height:3px; border-radius:100px; }
    .input-field { width:100%; background:var(--card); border:1.5px solid var(--border); border-radius:12px; padding:13px 17px; color:var(--text); font-family:'Outfit',sans-serif; font-size:1rem; outline:none; transition:border-color .2s; margin-bottom:1.2rem; }
    .input-field:focus { border-color:rgba(255,255,255,0.28); }
    .input-field::placeholder { color:var(--sub); }
    .skip-link { display:block; text-align:center; margin-top:.9rem; font-size:.8rem; color:var(--sub); background:none; border:none; cursor:pointer; transition:color .2s; }
    .skip-link:hover { color:var(--text); }

    /* ── Questions ───────────────────────────── */
    .page-questions { min-height:100vh; display:flex; flex-direction:column; }
    .q-header { padding:1.2rem 2rem .8rem; position:sticky; top:0; background:var(--bg); z-index:10; border-bottom:1px solid var(--border); }
    .q-header-inner { max-width:740px; margin:0 auto; width:100%; }
    .q-header-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:.65rem; }
    .q-header-title { font-family:'Syne',sans-serif; font-size:.78rem; font-weight:700; color:var(--sub); letter-spacing:.09em; text-transform:uppercase; }
    .q-header-count { font-size:.78rem; color:var(--sub); }
    .prog-track { height:3px; background:var(--card); border-radius:100px; overflow:hidden; }
    .prog-fill { height:100%; background:linear-gradient(90deg,var(--y),var(--r),var(--b),var(--g)); border-radius:100px; transition:width .45s ease; }

    .q-area { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem 1.5rem; }
    .q-hint { max-width:740px; width:100%; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:.85rem 1.1rem; margin-bottom:1.4rem; display:flex; align-items:flex-start; gap:9px; }
    .q-hint svg { flex-shrink:0; margin-top:2px; color:var(--sub); }
    .q-hint p { font-size:.82rem; color:var(--sub); line-height:1.55; }
    .q-hint strong { color:var(--text); }
    .q-card { max-width:740px; width:100%; }
    .q-eyebrow { font-size:.68rem; letter-spacing:.13em; text-transform:uppercase; color:var(--sub); margin-bottom:.4rem; }
    .q-prompt { font-size:clamp(1.6rem,4.5vw,2.4rem); font-weight:800; margin-bottom:1.8rem; letter-spacing:-.015em; }

    .opts-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    @media(max-width:580px){ .opts-grid{grid-template-columns:1fr;} }

    .opt-card { background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:1.2rem 1.3rem; transition:border-color .22s,background .22s,box-shadow .22s; cursor:default; }
    .opt-card:hover { border-color:rgba(255,255,255,0.18); box-shadow:0 0 0 3px rgba(255,255,255,0.04), 0 4px 20px rgba(0,0,0,0.25); }
    .opt-card.ranked { }
    .opt-head { display:flex; align-items:center; gap:7px; margin-bottom:.35rem; }
    .opt-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .opt-clr-lbl { font-size:.62rem; text-transform:uppercase; letter-spacing:.1em; color:var(--sub); }
    .opt-rank-badge { margin-left:auto; width:21px; height:21px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-size:.72rem; font-weight:700; color:#0d0d1a; animation:popIn .25s ease; }
    .opt-text { font-size:1rem; font-weight:500; margin-bottom:1.1rem; margin-top:.15rem; line-height:1.4; }

    /* ── Instructions page ───────────────────────────── */
    .page-instructions { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1rem; }
    .instr-card { background:var(--surface); border:1px solid var(--border); border-radius:24px; padding:2.8rem 2rem; max-width:580px; width:100%; animation:scaleIn .4s ease both; }
    @media(max-width:480px){ .instr-card { padding:1.8rem 1.2rem; border-radius:18px; } }
    .instr-card h2 { font-size:1.9rem; font-weight:800; margin-bottom:.35rem; }
    .instr-card > p { color:var(--sub); font-size:.92rem; margin-bottom:1.8rem; line-height:1.55; }
    .instr-ranks { display:flex; flex-direction:column; gap:.55rem; margin-bottom:1.6rem; }
    .instr-rank-row { display:flex; align-items:center; gap:.9rem; }
    .instr-rank-num { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-weight:700; font-size:.85rem; flex-shrink:0; }
    .instr-rank-desc { font-size:.88rem; line-height:1.4; }
    .instr-rank-desc strong { color:var(--text); }
    .instr-example { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.2rem 1.4rem; margin-bottom:1.8rem; }
    .instr-example-label { font-size:.65rem; letter-spacing:.12em; text-transform:uppercase; color:var(--sub); margin-bottom:.75rem; }
    .instr-example-prompt { font-size:.82rem; color:var(--sub); margin-bottom:.9rem; }
    .instr-example-grid { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
    @media(max-width:480px){ .instr-example-grid { grid-template-columns:1fr; } }
    .instr-ex-item { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.7rem .9rem; min-width:0; }
    .instr-ex-word { font-size:.88rem; font-weight:600; color:var(--text); margin-bottom:.4rem; }
    .instr-ex-badge { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; font-family:'Syne',sans-serif; font-size:.75rem; font-weight:700; color:#0d0d1a; }
    .instr-note { font-size:.78rem; color:var(--sub); line-height:1.55; margin-bottom:1.8rem; padding:.7rem .9rem; border-left:2px solid var(--border); }
    .rank-row { display:flex; gap:5px; }
    .rank-btn { width:34px; height:34px; border-radius:50%; border:1.5px solid var(--border); background:transparent; color:var(--sub); font-family:'Syne',sans-serif; font-size:.82rem; font-weight:700; cursor:pointer; transition:all .15s; display:flex; align-items:center; justify-content:center; }
    .rank-btn:hover:not(.on) { border-color:rgba(255,255,255,0.24); color:var(--text); }
    .rank-btn.on { color:#0d0d1a; border-color:transparent; transform:scale(1.1); }

    .q-nav { display:flex; justify-content:space-between; align-items:center; max-width:740px; width:100%; margin-top:1.8rem; padding-bottom:1.5rem; }
    .nav-prev,.nav-next { display:flex; align-items:center; gap:6px; padding:9px 18px; background:var(--surface); border:1px solid var(--border); border-radius:100px; color:var(--sub); font-family:'Outfit',sans-serif; font-size:.88rem; cursor:pointer; transition:all .2s; }
    .nav-prev:hover:not(:disabled),.nav-next:hover:not(:disabled) { color:var(--text); border-color:rgba(255,255,255,0.18); }
    .nav-prev:disabled,.nav-next:disabled { opacity:.28; cursor:default; }
    .nav-next { background:white; color:#0d0d1a; border-color:white; font-weight:600; }
    .nav-next:hover:not(:disabled) { background:rgba(255,255,255,.88); }
    .nav-next:disabled { background:var(--card); color:var(--sub); border-color:var(--border); }
    .dots-row { display:flex; gap:4px; align-items:center; flex-wrap:wrap; max-width:200px; justify-content:center; }
    .nav-dot { height:6px; border-radius:100px; cursor:pointer; transition:all .22s ease; }
    .submit-btn { display:flex; align-items:center; gap:8px; padding:11px 26px; background:linear-gradient(135deg,var(--y),var(--r)); color:white; border:none; border-radius:100px; font-family:'Syne',sans-serif; font-size:.95rem; font-weight:700; cursor:pointer; transition:transform .2s,box-shadow .2s; }
    .submit-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 8px 30px rgba(245,158,11,.28); }
    .submit-btn:disabled { opacity:.38; cursor:default; }
    .toast { position:fixed; top:18px; right:18px; background:var(--g); color:#0d0d1a; border-radius:100px; padding:9px 17px; font-family:'Syne',sans-serif; font-weight:700; font-size:.82rem; z-index:100; animation:toast 1.8s ease forwards; pointer-events:none; }

    /* ── Results ─────────────────────────────── */
    .page-results { min-height:100vh; padding:3.5rem 1.5rem 4rem; display:flex; flex-direction:column; align-items:center; }
    .res-header { text-align:center; max-width:580px; margin-bottom:3rem; animation:fadeUp .6s ease both; }
    .res-badge { display:inline-block; padding:4px 14px; border-radius:100px; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; font-weight:600; margin-bottom:1rem; }
    .res-title { font-size:clamp(2.2rem,5.5vw,3.8rem); font-weight:800; line-height:1.08; margin-bottom:.6rem; }
    .res-sub { color:var(--sub); font-size:.95rem; }
    .res-body { max-width:760px; width:100%; }

    .scores-box { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:1.8rem; margin-bottom:1.6rem; animation:fadeUp .6s .12s ease both; }
    .box-eyebrow { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--sub); margin-bottom:1.4rem; }
    .score-row { margin-bottom:1.2rem; }
    .score-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:.45rem; }
    .score-name { display:flex; align-items:center; gap:8px; font-size:.9rem; font-weight:500; }
    .score-ndot { width:7px; height:7px; border-radius:50%; }
    .score-pts { font-family:'Syne',sans-serif; font-weight:700; font-size:.9rem; }
    .score-track { height:7px; background:var(--card); border-radius:100px; overflow:hidden; }
    .score-fill { height:100%; border-radius:100px; transition:width 1.1s cubic-bezier(.22,1,.36,1); }

    .primary-box { border-radius:20px; padding:2.3rem; margin-bottom:1.6rem; animation:fadeUp .6s .25s ease both; }
    .prim-tag { display:inline-block; padding:3px 12px; border-radius:100px; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; font-weight:700; background:rgba(255,255,255,.13); margin-bottom:.7rem; }
    .prim-type { font-size:clamp(1.9rem,4.5vw,2.7rem); font-weight:800; margin-bottom:.25rem; letter-spacing:-.015em; }
    .prim-tag2 { font-size:.8rem; font-style:italic; margin-bottom:1.2rem; opacity:.75; }
    .prim-desc { font-size:.92rem; line-height:1.72; color:rgba(255,255,255,.82); margin-bottom:1.4rem; }
    .prim-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    @media(max-width:480px){ .prim-grid{grid-template-columns:1fr;} }
    .prim-cell-lbl { font-size:.62rem; text-transform:uppercase; letter-spacing:.1em; margin-bottom:.3rem; }
    .prim-cell-val { font-size:.82rem; color:rgba(255,255,255,.65); line-height:1.5; }

    .all-cards { display:grid; grid-template-columns:1fr 1fr; gap:.9rem; margin-bottom:1.6rem; animation:fadeUp .6s .38s ease both; }
    @media(max-width:520px){ .all-cards{grid-template-columns:1fr;} }
    .mini-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:1.2rem; border-top:3px solid transparent; }
    .mini-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:.2rem; }
    .mini-type { font-family:'Syne',sans-serif; font-weight:700; font-size:.95rem; }
    .mini-rank { font-size:.65rem; padding:2px 8px; border-radius:100px; font-weight:600; }
    .mini-clr { font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; margin-bottom:.65rem; }
    .mini-desc { font-size:.8rem; color:var(--sub); line-height:1.52; }

    .dl-section { text-align:center; animation:fadeUp .6s .5s ease both; }
    .btn-dl { display:inline-flex; align-items:center; gap:10px; padding:14px 32px; background:white; color:#0d0d1a; border:none; border-radius:100px; font-family:'Syne',sans-serif; font-weight:700; font-size:1rem; cursor:pointer; transition:transform .2s,box-shadow .2s; }
    .btn-dl:hover { transform:translateY(-3px); box-shadow:0 14px 44px rgba(255,255,255,.14); }
    .btn-retake { display:inline-flex; align-items:center; gap:7px; padding:10px 20px; background:transparent; color:var(--sub); border:1px solid var(--border); border-radius:100px; font-family:'Outfit',sans-serif; font-size:.88rem; cursor:pointer; margin-top:1rem; transition:all .2s; }
    .btn-retake:hover { color:var(--text); border-color:rgba(255,255,255,.18); }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.22.10/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { jsPDF } = window.jspdf;

const CM = {
  yellow:{ hex:'#f59e0b', dim:'rgba(245,158,11,0.13)', label:'Yellow', rgb:[245,158,11] },
  blue:  { hex:'#60a5fa', dim:'rgba(96,165,250,0.13)',  label:'Blue',   rgb:[96,165,250] },
  red:   { hex:'#f87171', dim:'rgba(248,113,113,0.13)', label:'Red',    rgb:[248,113,113] },
  green: { hex:'#34d399', dim:'rgba(52,211,153,0.13)',  label:'Green',  rgb:[52,211,153] },
};

const questions = [
  { id:1,  prompt:"I am:", options:{ yellow:"Encourager", blue:"Deep thinker", red:"Doer", green:"Listener" }},
  { id:2,  prompt:"I am:", options:{ yellow:"Motivator", blue:"Organizer", red:"Achiever", green:"Mediator" }},
  { id:3,  prompt:"I am:", options:{ yellow:"Charismatic", blue:"Realistic", red:"Dynamic", green:"Diplomatic" }},
  { id:4,  prompt:"I am:", options:{ yellow:"Stimulating", blue:"Systematic", red:"Decisive", green:"Accommodating" }},
  { id:5,  prompt:"I am:", options:{ yellow:"Spontaneous", blue:"Perfectionist", red:"Risking", green:"Accepting" }},
  { id:6,  prompt:"I am:", options:{ yellow:"Cheerful", blue:"Purposeful", red:"Forceful", green:"Tactful" }},
  { id:7,  prompt:"I am:", options:{ yellow:"Promoter", blue:"Planner", red:"Producer", green:"Supporter" }},
  { id:8,  prompt:"I am:", options:{ yellow:"Interrupts", blue:"Critical", red:"Impatient", green:"Indifferent" }},
  { id:9,  prompt:"I am:", options:{ yellow:"Unfocused", blue:"Pessimistic", red:"Controlling", green:"Indecisive" }},
  { id:10, prompt:"I am:", options:{ yellow:"Persuasive", blue:"Diligent", red:"Competitive", green:"Compassionate" }},
  { id:11, prompt:"I am motivated by:", options:{ yellow:"Fun & freedom", blue:"Belonging & contributing", red:"Power & results", green:"Peace & balance" }},
  { id:12, prompt:"I like:", options:{ yellow:"Variety & activity", blue:"Facts, data & order", red:"Bottom line results", green:"Low key situations" }},
  { id:13, prompt:"I fear:", options:{ yellow:"Loss of relationship", blue:"Change & disorder", red:"Loss of control", green:"Loss of harmony" }},
  { id:14, prompt:"I need to be:", options:{ yellow:"Affirmed & recognized", blue:"Appreciated for my quality work", red:"Respected for my accomplishments", green:"Accepted for who I am" }},
  { id:15, prompt:"I am known for:", options:{ yellow:"Knowing how to have a good time", blue:"Doing things right", red:"Making things happen", green:"Making people feel accepted" }},
  { id:16, prompt:"At work I would be described as:", options:{ yellow:"Outgoing & social", blue:"Accurate & reliable", red:"Direct & driven", green:"Patient & neutral" }},
  { id:17, prompt:"I like being with people who are:", options:{ yellow:"Verbally open & casual", blue:"Thoughtful & do their part", red:"Competent & get their job done", green:"Caring & kind" }},
  { id:18, prompt:"A key part of who I am is:", options:{ yellow:"My relationships with others", blue:"My organization & systems", red:"My accomplishments", green:"My stability" }},
  { id:19, prompt:"I am frustrated by:", options:{ yellow:"Routine/repetition", blue:"Unpredictability", red:"Incompetence", green:"Insensitivity" }},
  { id:20, prompt:"Under stress I become:", options:{ yellow:"Fragmented & disorganized", blue:"Moody & withdrawn", red:"Dictatorial & assertive", green:"Overwhelmed & tired" }},
];

const profiles = {

// ─────────────── PDF Generator ────────────────────────────────────────────
function generatePDF(name, sorted) {
  const doc = new jsPDF();
  const pw = doc.internal.pageSize.getWidth();
  const ph = doc.internal.pageSize.getHeight();
  const displayName = name || "Anonymous";
  const today = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const primary = sorted[0];
  const pC = CM[primary.color].rgb;

  // helpers
  const fill  = (rgb) => doc.setFillColor(rgb[0],rgb[1],rgb[2]);
  const tclr  = (rgb) => doc.setTextColor(rgb[0],rgb[1],rgb[2]);
  const dclr  = (rgb) => doc.setDrawColor(rgb[0],rgb[1],rgb[2]);
  const HR    = (y, clr=[218,218,232]) => { dclr(clr); doc.setLineWidth(.28); doc.line(18,y,pw-18,y); };
  const wrap  = (txt, maxW) => doc.splitTextToSize(String(txt||''), maxW);
  const lighter = ([r,g,b], amt=45) => [Math.min(r+amt,255),Math.min(g+amt,255),Math.min(b+amt,255)];
  const darker  = ([r,g,b], amt=60) => [Math.max(r-amt,0),Math.max(g-amt,0),Math.max(b-amt,0)];
  const WHITE = [255,255,255];
  const DARK  = [15,15,26];
  const GRAY  = [90,90,115];
  const LGRAY = [230,230,242];

  // ── COVER PAGE ──────────────────────────────────────────────────────────
  const ML = 20;          // left margin (mm)
  const MR = 20;          // right margin (mm)
  const TW = pw - ML - MR; // full text width = pw-40
  fill(pC); doc.rect(0,0,pw,72,'F');
  fill(lighter(pC,50)); doc.rect(pw-55,0,55,72,'F');
  fill(darker(pC,20)); doc.rect(0,68,pw,4,'F');

  // label
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
  tclr([...WHITE.map(v=>v*0.85)]); // slightly dimmer white
  doc.text('PERSONALITY PROFILE',ML,18);

  // big type name
  doc.setFont('helvetica','bold'); doc.setFontSize(34);
  tclr(WHITE);
  doc.text(profiles[primary.color].type.toUpperCase(), ML, 44);

  // tagline
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  tclr(WHITE);
  doc.text(profiles[primary.color].tagline, ML, 56);

  // name + date (right)
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  tclr(WHITE);
  doc.text(displayName, pw-MR, 25, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
  doc.text(today, pw-MR, 34, {align:'right'});

  // white body
  fill(WHITE); doc.rect(0,72,pw,ph-72,'F');

  // score bars section
  let y = 88;
  doc.setFont('helvetica','bold'); doc.setFontSize(7); tclr([150,150,175]);
  doc.text('PERSONALITY SCORE RESULTS', ML, y); y+=7;

  const maxSc = 80;
  sorted.forEach(({color, score},i) => {
    const m = CM[color];
    const barW = Math.round((score/maxSc)*TW);
    // labels
    doc.setFont('helvetica','bold'); doc.setFontSize(9); tclr(DARK);
    doc.text(`${profiles[color].type}`, ML, y+4);
    doc.setFont('helvetica','bold'); doc.setFontSize(9); tclr(m.rgb);
    doc.text(`${score} pts`, pw-MR, y+4, {align:'right'});
    // track
    fill(LGRAY); doc.roundedRect(ML, y+7, TW, 5.5, 2.5, 2.5,'F');
    // fill bar
    fill(m.rgb); doc.roundedRect(ML, y+7, barW, 5.5, 2.5, 2.5,'F');
    y += 20;
  });

  HR(y+2); y+=12;

  // primary description section
  doc.setFont('helvetica','bold'); doc.setFontSize(7); tclr([150,150,175]);
  doc.text('YOUR PRIMARY PERSONALITY TYPE', ML, y); y+=8;

  // accent bar + description — set font BEFORE wrap so splitTextToSize measures at render size
  fill(pC); doc.rect(ML,y,3,40,'F');
  doc.setFont('helvetica','normal'); doc.setFontSize(9); tclr([35,35,60]);
  const descLines = wrap(profiles[primary.color].full, TW - 8);
  doc.text(descLines, ML + 8, y+5);
  y += Math.max(32, descLines.length * 5 + 6);

  // trait boxes
  const traitData = [
    {label:'Strengths', val:profiles[primary.color].strengths},
    {label:'Limitations', val:profiles[primary.color].limits},
    {label:'Core Needs', val:profiles[primary.color].needs},
    {label:'Key Wants', val:profiles[primary.color].wants},
  ];
  doc.setFont('helvetica','bold'); doc.setFontSize(7); tclr([150,150,175]);
  doc.text('KEY TRAITS', ML, y); y+=6;

  traitData.forEach(({label,val},i) => {
    if (y > ph-28) { doc.addPage(); fill(WHITE); doc.rect(0,0,pw,ph,'F'); y=18; }
    const traitIndent = ML + 7;
    const traitW = pw - traitIndent - MR;
    // Set render font BEFORE wrap
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); tclr([35,35,60]);
    const vLines = wrap(val, traitW);
    const bh = Math.max(13, vLines.length*4.2+7);
    fill(i%2===0 ? [248,248,253] : WHITE); doc.rect(ML,y,TW,bh,'F');
    fill(pC); doc.rect(ML,y,2.5,bh,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(6.5); tclr([140,140,165]);
    doc.text(label.toUpperCase(), traitIndent, y+5);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); tclr([35,35,60]);
    doc.text(vLines, traitIndent, y+10);
    y += bh+3;
  });

  HR(y+3); y+=11;
  // motto
  doc.setFont('helvetica','bold'); doc.setFontSize(7); tclr([150,150,175]);
  doc.text('MOTTO', ML, y); y+=6;
  doc.setFont('helvetica','italic'); doc.setFontSize(10); tclr(pC);
  const mottoLines = wrap(profiles[primary.color].motto, TW); // font already set above
  doc.text(mottoLines, ML, y);

  // ── PROFILE PAGES ──────────────────────────────────────────────────────
  sorted.forEach(({color, score}) => {
    doc.addPage();
    const m = CM[color];
    const sect = pdfSections[color];
    const prof = profiles[color];

    // header band
    fill(m.rgb); doc.rect(0,0,pw,42,'F');
    fill(lighter(m.rgb,42)); doc.rect(pw-52,0,52,42,'F');
    fill(darker(m.rgb,18)); doc.rect(0,38,pw,4,'F');

    doc.setFont('helvetica','bold'); doc.setFontSize(20); tclr(WHITE);
    doc.text(prof.type.toUpperCase(), ML, 22);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); tclr(WHITE);
    doc.text(sect.title, ML, 33);
    // score badge
    doc.setFont('helvetica','bold'); doc.setFontSize(22); tclr(WHITE);
    doc.text(String(score), pw-MR, 24, {align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(6.5); tclr(WHITE);
    doc.text('POINTS', pw-MR, 32, {align:'right'});

    fill(WHITE); doc.rect(0,42,pw,ph-42,'F');
    let cy = 54;

    // Label column ends at x=70, value text starts at x=72, must end by pw-MR
    const labelX = ML + 4;
    const valX   = ML + 54;           // ~74mm — same visual position as before
    const valW   = pw - valX - MR;    // text width respects right margin

    sect.rows.forEach((row,ri) => {
      if (cy > ph-18) {
        doc.addPage();
        fill(m.rgb); doc.rect(0,0,pw,6,'F');
        fill(WHITE); doc.rect(0,6,pw,ph-6,'F');
        cy = 16;
      }
      // Set render font BEFORE wrap so splitTextToSize measures at correct size
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); tclr([28,28,50]);
      const valLines = wrap(row.v, valW);
      const rowH = Math.max(9.5, valLines.length*4+5);
      if (ri%2===0){ fill([247,248,253]); doc.rect(ML-2,cy-3.5,TW+4,rowH+1,'F'); }
      fill(m.rgb); doc.rect(ML-2,cy-3.5,2.2,rowH+1,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(6.5); tclr([140,140,165]);
      doc.text(row.l.toUpperCase(), labelX, cy);
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); tclr([28,28,50]);
      doc.text(valLines, valX, cy);
      cy += rowH+2.5;
    });
  });

  // ── SUMMARY TABLE PAGE ─────────────────────────────────────────────────
  doc.addPage();
  fill(DARK); doc.rect(0,0,pw,38,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(15); tclr(WHITE);
  doc.text('PERSONALITY TYPE SUMMARY', 20, 20);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); tclr([150,160,190]);
  doc.text('A comparative overview of all four personality types', 20, 30);
  fill(WHITE); doc.rect(0,38,pw,ph-38,'F');

  // column positions
  const CX = [18,56,96,136,174];
  const CW = [34,36,36,36,34];
  const CK = ['y','b','r','g'];

  let ty = 51;
  // col headers
  doc.setFont('helvetica','bold'); doc.setFontSize(7); tclr([140,140,165]);
  doc.text('CATEGORY', CX[0], ty);
  CK.forEach((k,i) => {
    tclr(CM[{y:'yellow',b:'blue',r:'red',g:'green'}[k]].rgb);
    doc.text(CM[{y:'yellow',b:'blue',r:'red',g:'green'}[k]].label.toUpperCase(), CX[i+1], ty);
  });
  ty+=3; HR(ty,[210,210,230]); ty+=5;

  summaryRows.forEach((row,ri) => {
    const colorMap = {y:'yellow',b:'blue',r:'red',g:'green'};
    const allLines = CK.map((k,ci) => wrap(row[k]||'', CW[ci+1]-2));
    const maxL = Math.max(...allLines.map(l=>l.length));
    const rowH = Math.max(10, maxL*3.6+5);

    if (ty+rowH > ph-14) {
      doc.addPage();
      fill(DARK); doc.rect(0,0,pw,7,'F');
      fill(WHITE); doc.rect(0,7,pw,ph-7,'F');
      ty = 17;
    }

    if (ri%2===0){ fill([248,249,253]); doc.rect(18,ty-3,pw-36,rowH,'F'); }
    dclr([225,225,238]); doc.setLineWidth(.18); doc.line(18,ty+rowH-3,pw-18,ty+rowH-3);

    doc.setFont('helvetica','bold'); doc.setFontSize(7); tclr([75,75,105]);
    doc.text(row.cat, CX[0], ty+2);
    CK.forEach((k,ci) => {
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); tclr([28,28,50]);
      doc.text(allLines[ci], CX[ci+1], ty+2);
    });
    ty += rowH;
  });

  // page footers
  const totalPages = doc.internal.getNumberOfPages();
  for (let i=1; i<=totalPages; i++) {
    doc.setPage(i);
    doc.setFont('helvetica','normal'); doc.setFontSize(6.5); tclr([180,180,205]);
    doc.text(`Color Personality Test  ·  ${displayName}  ·  Page ${i} of ${totalPages}`, pw/2, ph-7, {align:'center'});
  }

  doc.save(`color-personality-${(name||'anonymous').toLowerCase().replace(/\s+/g,'-')}.pdf`);
}

// ─────────────── Option Card ───────────────────────────────────────────────
function OptionCard({ color, text, rank, onSelect }) {
  const m = CM[color];
  return (
    <div className="opt-card" style={rank ? {borderColor:m.hex, background:m.dim} : {}}>
      <div className="opt-head">
        {/* Color label intentionally hidden — users rank by trait, not color */}
        {rank && (
          <div className="opt-rank-badge" style={{background:m.hex}}>{rank}</div>
        )}
      </div>
      <div className="opt-text">{text}</div>
      <div className="rank-row">
        {[1,2,3,4].map(n=>(
          <button
            key={n}
            className={`rank-btn ${rank===n?'on':''}`}

          >{n}</button>
        ))}

// ─────────────── Option order rotation per question ────────────────────────
// Each question's four options appear in a different positional order so that
// no single color is always top-left / top-right / etc. 8 distinct patterns,
// cycling through all 20 questions (pattern index = (qId-1) % 8).
const OPTION_ORDERS = [
  ['yellow','blue','red','green'],   // Q1,  Q9,  Q17
  ['red','green','yellow','blue'],   // Q2,  Q10, Q18
  ['blue','red','green','yellow'],   // Q3,  Q11, Q19
  ['green','yellow','blue','red'],   // Q4,  Q12, Q20
  ['yellow','red','blue','green'],   // Q5,  Q13
  ['blue','yellow','green','red'],   // Q6,  Q14
  ['red','blue','yellow','green'],   // Q7,  Q15
  ['green','red','yellow','blue'],   // Q8,  Q16
];
const getOptionOrder = (qId) => OPTION_ORDERS[(qId - 1) % OPTION_ORDERS.length];

// ─────────────── Questions Page ────────────────────────────────────────────
function QuestionsPage({ rankings, setRankings, onSubmit }) {
  const [cur, setCur]     = useState(0);
  const [dir, setDir]     = useState('right');
  const [toast, setToast] = useState(false);
  const animKey           = `${cur}-${dir}`;

  const q = questions[cur];
  const qR = rankings[q.id] || {};

  const isQDone = (id) => {
    const r = rankings[id] || {};
    return Object.keys(r).length===4 && new Set(Object.values(r)).size===4;
  };
  const doneCount = questions.filter(q=>isQDone(q.id)).length;
  const allDone   = doneCount===questions.length;

  const handleSelect = (color, rank) => {
    const newR = { ...rankings };
    const cur2 = { ...(newR[q.id]||{}) };
    // remove rank from other color
    Object.keys(cur2).forEach(c=>{ if(cur2[c]===rank && c!==color) delete cur2[c]; });
    // toggle off
    if(cur2[color]===rank) delete cur2[color];
    else cur2[color]=rank;
    newR[q.id]=cur2;
    setRankings(newR);

    const nowDone = Object.keys(cur2).length===4 && new Set(Object.values(cur2)).size===4;
    if(nowDone && !isQDone(q.id)) {
      setToast(true);
      setTimeout(()=>setToast(false),1800);
      if(cur < questions.length-1) {
        setTimeout(()=>{ setDir('right'); setCur(c=>c+1); }, 550);
      }
    }
  };

  const goTo = (idx) => { setDir(idx>cur?'right':'left'); setCur(idx); };

  return (
    <div className="page-questions">
      {toast && <div className="toast">✓ Nicely ranked!</div>}

      <div className="q-header">
        <div className="q-header-inner">
          <div className="q-header-row">
            <span className="q-header-title">Color Personality Test</span>
            <span className="q-header-count">{doneCount} / {questions.length} complete</span>
          </div>
          <div className="prog-track">
            <div className="prog-fill" style={{width:`${(doneCount/questions.length)*100}%`}}/>
          </div>
        </div>
      </div>

      <div className="q-area">
        <div className="q-hint">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <circle cx="7.5" cy="7.5" r="6.5" stroke="currentColor" strokeWidth="1.2"/>
            <path d="M7.5 6.5v4M7.5 4.5h.01" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
          </svg>
          <p>Rank each option <strong>1–4</strong> based on how well it describes you. <strong>4 = most like you</strong>, 1 = least like you. Each number may only be used once per question.</p>
        </div>

        <div
          className="q-card"
          key={animKey}
          style={{animation:`${dir==='right'?'slideFromRight':'slideFromLeft'} .3s ease both`}}
        >
          <div className="q-eyebrow">Question {q.id} of {questions.length}</div>
          <h2 className="q-prompt">{q.prompt}</h2>
          <div className="opts-grid">
            {getOptionOrder(q.id).map(color=>(
              <OptionCard key={color} color={color} text={q.options[color]} rank={qR[color]} onSelect={handleSelect}/>
            ))}
          </div>
        </div>

        <div className="q-nav">
          <button className="nav-prev" onClick={()=>goTo(cur-1)} disabled={cur===0}>
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
              <path d="M8 2.5L4 6.5L8 10.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
            Prev
          </button>

          <div className="dots-row">
            {questions.map((_,i)=>{
              const done = isQDone(questions[i].id);
              return (
                <div
                  key={i}
                  className="nav-dot"
                  onClick={()=>goTo(i)}
                  style={{
                    width: i===cur ? 14 : 6,
                    background: done ? '#34d399' : i===cur ? 'white' : 'var(--card)',
                  }}
                />
              );
            })}
          </div>

          {cur < questions.length-1 ? (
            <button className="nav-next" onClick={()=>goTo(cur+1)}>
              Next
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                <path d="M5 2.5L9 6.5L5 10.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          ) : (
            <button className="submit-btn" onClick={onSubmit} disabled={!allDone}>
              {allDone ? 'See Results' : `${doneCount}/${questions.length} done`}
              {allDone && (
                <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                  <path d="M5 2.5L9 6.5L5 10.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              )}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ─────────────── Animated Score Bar ────────────────────────────────────────
function ScoreBar({ color, score, maxScore, delay }) {
  const [w, setW] = useState(0);
  useEffect(()=>{
    const t = setTimeout(()=>setW(Math.round((score/maxScore)*100)), delay*1000+100);
    return ()=>clearTimeout(t);
  },[]);
  const m = CM[color];
  return (
    <div className="score-row">
      <div className="score-top">
        <div className="score-name">
          <div className="score-ndot" style={{background:m.hex}}/>
          <span>{profiles[color].type}</span>
          <span style={{color:'var(--sub)',fontSize:'.8rem'}}>({m.label})</span>
        </div>
        <div className="score-pts" style={{color:m.hex}}>{score} pts</div>
      </div>
      <div className="score-track">
        <div className="score-fill" style={{background:m.hex, width:`${w}%`}}/>
      </div>
    </div>
  );
}

// ─────────────── Results Page ───────────────────────────────────────────────
function ResultsPage({ rankings, userName, onRetake }) {
  const totals = {yellow:0,blue:0,red:0,green:0};
  Object.values(rankings).forEach(q=>{
    Object.entries(q).forEach(([c,r])=>{ totals[c]+=r; });
  });
  const sorted = Object.entries(totals)
    .map(([color,score])=>({color,score}))
    .sort((a,b)=>b.score-a.score);

  const primary = sorted[0];
  const pm = CM[primary.color];
  const pp = profiles[primary.color];

  return (
    <div className="page-results">
      <div className="res-header">
        <div className="res-badge" style={{background:pm.dim,color:pm.hex}}>
          Your Results
        </div>
        <h1 className="res-title">
          You are a<br/>
          <span style={{color:pm.hex}}>{pp.type}</span>
        </h1>
        <p className="res-sub">
          {userName ? `Great work, ${userName}!` : 'Great work!'} Here's your personality breakdown.
        </p>
      </div>

      <div className="res-body">
        {/* Score bars */}
        <div className="scores-box">
          <div className="box-eyebrow">Score Breakdown (Higher = Stronger Alignment)</div>
          {sorted.map(({color,score},i)=>(
            <ScoreBar key={color} color={color} score={score} maxScore={80} delay={i*.12}/>
          ))}
        </div>

        {/* Primary type card */}
        <div className="primary-box" style={{background:pm.dim,border:`1.5px solid ${pm.hex}30`}}>
          <div className="prim-tag">Primary Type · {pm.label}</div>
          <h2 className="prim-type" style={{color:pm.hex}}>{pp.type}</h2>
          <p className="prim-tag2" style={{color:pm.hex}}>{pp.tagline}</p>
          <p className="prim-desc">{pp.full}</p>
          <div className="prim-grid">
            {[
              {label:'Strengths', val:pp.strengths},
              {label:'Limitations', val:pp.limits},
              {label:'Core Needs', val:pp.needs},
              {label:'What Drives You', val:pp.wants},
            ].map(({label,val})=>(
              <div key={label}>
                <div className="prim-cell-lbl" style={{color:pm.hex}}>{label}</div>
                <div className="prim-cell-val">{val}</div>
              </div>
            ))}
          </div>
        </div>

        {/* All four mini cards */}
        <div className="all-cards">
          {sorted.map(({color},rank)=>{
            const m=CM[color], p=profiles[color];
            return (
              <div key={color} className="mini-card" style={{borderTopColor:m.hex}}>
                <div className="mini-head">
                  <div className="mini-type">{p.type}</div>
                  <div className="mini-rank" style={{background:m.dim,color:m.hex}}>#{rank+1}</div>
                </div>
                <div className="mini-clr" style={{color:m.hex}}>{m.label}</div>
                <div className="mini-desc">{p.short}</div>
              </div>
            );
          })}
        </div>

        {/* Download */}
        <div className="dl-section">
          <button className="btn-dl" onClick={()=>generatePDF(userName, sorted)}>
            <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
              <path d="M8.5 2v9M8.5 11L5 7.5M8.5 11L12 7.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
              <path d="M3 14h11" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
            </svg>
            Download Full PDF Report
          </button>
          <br/>
          <button className="btn-retake" onClick={onRetake}>
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
              <path d="M2 6.5C2 4.01 4.01 2 6.5 2C8.99 2 11 4.01 11 6.5" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
              <path d="M2 6.5L3.8 4.7M2 6.5L3.8 8.3" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
            Retake Test
          </button>
        </div>
      </div>
    </div>
  );
}

// ─────────────── Instructions Page ────────────────────────────────────────
function InstructionsPage({ onStart }) {
  const exampleItems = [
    { word:'Dramatic',      rank:3, bg:'#8B5CF6', tc:'#fff' },  // purple
    { word:'Precise',       rank:1, bg:'#64748B', tc:'#fff' },  // slate
    { word:'Powerful',      rank:4, bg:'#EC4899', tc:'#fff' },  // pink
    { word:'Accommodating', rank:2, bg:'#06B6D4', tc:'#fff' },  // cyan
  ];
  const rankMeta = [
    { n:4, label:'Most like you'          },
    { n:3, label:'Next most like you'     },
    { n:2, label:'Also somewhat like you' },
    { n:1, label:'Least like you'         },
  ];

  return (
    <div className="page-instructions">
      <div className="instr-card">
        <div className="color-bar-row">
          {Object.values(CM).map(m=><div key={m.label} style={{background:m.hex}}/>)}
        </div>

        <h2>How to take the test</h2>
        <p>You'll see 20 questions, each with <strong style={{color:'var(--text)'}}>4 trait words</strong>. Your job is to rank all four from 1 to 4 based on how well each one describes you — every number must be used exactly once per question.</p>

        {/* Rank scale */}
        <div className="instr-ranks">
          {rankMeta.map(({n,label})=>(
            <div key={n} className="instr-rank-row">
              <div className="instr-rank-num" style={{background:'var(--card)',color:'var(--text)',border:'1.5px solid var(--border)'}}>{n}</div>
              <div className="instr-rank-desc">
                <strong>= {label}</strong>
              </div>
            </div>
          ))}
        </div>

        {/* Example */}
        <div className="instr-example">
          <div className="instr-example-label">Example — "I am:"</div>
          <div className="instr-example-prompt">A person might rank these four traits like this:</div>
          <div className="instr-example-grid">
            {exampleItems.map(({word,rank,bg,tc})=>(
              <div key={word} className="instr-ex-item">
                <div className="instr-ex-word">{word}</div>
                <div className="instr-ex-badge" style={{background:bg,color:tc}}>{rank}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="instr-note">
          ✦ There are no right or wrong answers. Choose what honestly reflects you, not what you wish you were. When you finish all 4 rankings for a question, it will auto-advance to the next one.
        </div>

        <button className="btn-white" style={{width:'100%',justifyContent:'center'}} onClick={onStart}>
          Start Question 1
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  );
}

// ─────────────── App Shell ─────────────────────────────────────────────────
function App() {
  const [page, setPage]         = useState('welcome');
  const [rankings, setRankings] = useState({});
  const [userName, setUserName] = useState('');

  return (
    <>
      {page==='welcome'      && <WelcomePage onStart={()=>setPage('name')}/>}
      {page==='name'         && <NamePage onContinue={n=>{ setUserName(n); setPage('instructions'); }}/>}
      {page==='instructions' && <InstructionsPage onStart={()=>setPage('questions')}/>}
      {page==='questions'    && (
        <QuestionsPage
          rankings={rankings}
          setRankings={setRankings}
          onSubmit={()=>setPage('results')}
        />
      )}
      {page==='results'      && (
        <ResultsPage
          rankings={rankings}
          userName={userName}
          onRetake={()=>{ setRankings({}); setPage('welcome'); }}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
